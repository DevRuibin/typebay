<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Not Found | TypeBay</title>
    <link rel="stylesheet" href="styles/standalone.scss" />
    <link
      rel="icon"
      type="image/x-icon"
      sizes="32x32"
      href="images/favicon/favicon.ico"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <meta name="name" content="TypeBay | Free typing speed test" />
    <meta
      name="description"
      content="Free typing speed test that runs entirely in your browser. No sign-up, no tracking."
    />
    <meta name="theme-color" content="#4f46e5" id="metaThemeColor" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="404 Not Found | TypeBay" />
    <meta property="og:url" content="https://typebay.projectbay.uk/" />
  </head>
  <body>
    <script type="module" async>
      import { loadCSS } from "./ts/utils/misc";
      loadCSS("/css/fa.min.css", true);
      document.getElementById("page404").classList.remove("hidden");
      document.querySelector("header").classList.add("focus");
      document.title = "404 Not Found | TypeBay";
    </script>
    <load src="html/warnings.html" />
    <style>
      h1 {
        font-weight: unset;
        font-size: 2rem;
        margin-top: 3rem;
        color: var(--sub-color);
      }
      a.button {
        border-radius: var(--roundness);
        text-decoration: none;
        background: var(--sub-alt-color);
        color: var(--text-color);
        &:hover {
          background: var(--text-color);
          color: var(--bg-color);
        }
      }
      .page404 {
        display: grid;
        justify-content: center;
        height: 100%;
        align-content: center;
      }
      .page404 .content {
        display: grid;
        justify-items: center;
        gap: 1rem;
        text-align: center;
      }
      .page404 .title {
        font-size: 5rem;
        color: var(--main-color);
      }
      .page404 .big {
        font-size: 10rem;
        line-height: 10rem;
        color: var(--sub-color);
      }
      .page404 .button {
        padding: 1rem 2rem;
        width: max-content;
      }
    </style>
    <div id="app" class="content-grid focus">
      <header class="focus">
        <a id="logo" href="/" router-link="">
          <h1 class="text">
            <div class="top">typebay</div>
          </h1>
        </a>
      </header>
      <main style="height: 100%">
        <div class="page page404 hidden" id="page404">
          <div class="content">
            <div class="big">404</div>
            <div>This page doesn't exist.</div>
            <a href="/" class="button" router-link>
              <i class="fas fa-keyboard"></i>
              back to the test
            </a>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
